name: EvolveApp INC.
description: EvolveApp INC. (Evolve) is an AI-native enablement and performance platform for corporate
  learning and workforce training. Its product suite spans the Evolve LMS for courses, learning paths and
  branded academies; Evolve Generate for AI-powered course creation from raw materials; Evolve Studio for
  advanced authoring; an Assessment Center for skills and behavioral evaluation; an AI Knowledge Base
  instant-answer engine; and AI-driven Simulations for job-critical practice. Evolve serves 100+ enterprise
  clients and 2.9M+ learners worldwide, is SOC 2 (Type 1 and 2), ISO 27001 and GDPR compliant, and offers
  iOS and Android apps. The company is backed by 500 Global.
